name: Build UOx

# Builds the United Offensive 1.51x client (cod1x.dll) from the official source,
# xtnded/codextended-client-uo (GPL-3.0), at a pinned commit, and publishes it as a
# release of this repository. The project publishes no builds of its own; the
# installer downloads this release and checks it by SHA-256.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/build-uox.yml']

permissions:
  contents: write

env:
  UOX_REPO: xtnded/codextended-client-uo
  UOX_COMMIT: 146bcb1fd0f35a04cf61144d6cc3fe3de2b56f53

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UOX_REPO }}
          ref: ${{ env.UOX_COMMIT }}
          path: uox

      - uses: microsoft/setup-msbuild@v2

      # The project targets the Visual Studio 2015 XP toolset; the runner has the
      # Visual Studio 2022 one, which builds the same 32-bit DLL.
      - name: Build Release (x86)
        shell: pwsh
        working-directory: uox
        run: msbuild cod1x.sln /m /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Collect the DLL
        id: collect
        shell: pwsh
        run: |
          $dll = Get-ChildItem uox -Recurse -Filter cod1x.dll | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $dll) { throw 'cod1x.dll was not built.' }
          $out = New-Item -ItemType Directory -Path out -Force
          Copy-Item $dll.FullName (Join-Path $out 'cod1x.dll')
          Copy-Item uox\LICENSE (Join-Path $out 'LICENSE.txt')
          $sha = (Get-FileHash (Join-Path $out 'cod1x.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item (Join-Path $out 'cod1x.dll')).Length
          @(
            'United Offensive 1.51x client (cod1x.dll), built by GitHub Actions.'
            "Source: https://github.com/$env:UOX_REPO/tree/$env:UOX_COMMIT (GPL-3.0, see LICENSE.txt)"
            "Build: msbuild cod1x.sln Release x86, toolset v143"
            "SHA-256: $sha"
            "Size: $size bytes"
          ) | Set-Content (Join-Path $out 'SOURCE.txt') -Encoding ascii
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          Get-Content (Join-Path $out 'SOURCE.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: uox
          path: out

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'uox-' + $env:UOX_COMMIT.Substring(0, 7)
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; not replaced."; exit 0 }
          $notes = (Get-Content out\SOURCE.txt) -join "`n"
          gh release create $tag out\cod1x.dll out\LICENSE.txt out\SOURCE.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "UOx (United Offensive 1.51x) $tag" --notes $notes --prerelease
