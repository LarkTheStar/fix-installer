name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (PowerShell 5.1 and 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows PowerShell 5.1 is what most people run the utility with, so the parse
      # check uses it, not PowerShell 7.
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          foreach ($e in $errors) { Write-Output "::error file=install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          if ($errors.Count -gt 0) { exit 1 }
          Write-Output 'install.ps1 parses in Windows PowerShell 5.1.'

      - name: Install Pester 5 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install Pester 5 (PowerShell 7)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Invoke-Tests.ps1

      - name: Tests (PowerShell 7)
        if: always()
        shell: pwsh
        run: .\tests\Invoke-Tests.ps1

      - name: Window layout loads (WPF)
        if: always()
        shell: powershell
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Test-Xaml.ps1
